[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

lib_extra_dirs = ../common_mdp

; Side B on Jetson: working heartbeat firmware used TinyUSB CDC
; (enumerates as Espressif ESP32-S3-DevKitC / ...FB14...).
; USB_MODE=0 (HW JTAG CDC) flashed clean but Serial stayed silent on this board.
; Use TinyUSB CDC (USB_MODE=1) so Serial matches the live USB path.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

monitor_speed = 115200
upload_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^6.21.0
    adafruit/Adafruit NeoPixel@^1.12.0
    jgromes/RadioLib@^6.5.0
