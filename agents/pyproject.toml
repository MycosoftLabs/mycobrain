[project]
name = "mycobrain-agent"
version = "1.0.0"
description = "Unified host agent for MycoBrain devices (Jetson / Pi / standalone). HTTP on :8787, MQTT to mycosoft.com."
authors = [
    { name = "Mycosoft", email = "mycosoft.inc@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pyserial>=3.5",
    "paho-mqtt>=2.1",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyJWT[crypto]>=2.9",
    "cryptography>=43.0",
    "structlog>=24.4",
    "anyio>=4.4",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "hypothesis>=6.110",
]
jetson = [
    # Optional: only on actual Jetsons with CUDA
    # "onnxruntime-gpu>=1.18",
]
pi = [
    "RPi.GPIO; platform_machine=='aarch64' or platform_machine=='armv7l'",
]

[project.scripts]
mycobrain-agent = "mycobrain_agent.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
