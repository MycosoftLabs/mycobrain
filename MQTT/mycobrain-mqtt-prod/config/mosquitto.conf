# MycoBrain production Mosquitto — LAN + Cloudflare WSS (remote)
# Date: 2026-04-08

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# --- LAN / same-site: native MQTT (fast, no TLS in container) ---
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

# --- Remote: WebSockets → Cloudflare Tunnel HTTP ingress (wss://mqtt.mycosoft.com:443) ---
# Tunnel on Sandbox hits http://<broker-lan-ip>:9001; do not expose 9001 publicly.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
