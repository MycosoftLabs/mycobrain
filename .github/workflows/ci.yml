name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [side_a, side_b, gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build
        working-directory: firmware/${{ matrix.target }}
        run: pio run

  agentic-fallback:
    needs: build
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Agentic Auto-Fix
        run: |
          echo "Build failed. Triggering Mycosoft Antigravity Agent for autonomous resolution..."
          if [ -n "${{ secrets.AGENT_API_KEY }}" ]; then
            curl -X POST -H "Content-Type: application/json" -H "Authorization: Bearer ${{ secrets.AGENT_API_KEY }}" \
                 -d "{\"repo\": \"${{ github.repository }}\", \"run_id\": \"${{ github.run_id }}\"}" \
                 https://api.mycosoft.com/agent/auto-fix || echo "Fallback triggered."
          else
            echo "Agentic hook called, awaiting implementation."
          fi